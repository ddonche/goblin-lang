[package]
name = "goblin-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
goblin_lexer = { package = "goblin-lexer", path = "../goblin-lexer" }
goblin-diagnostics = { path = "../goblin-diagnostics" }
goblin-parser = { path = "../goblin-parser" } 
goblin-gql = { path = "../goblin-gql" }
goblin-interpreter = { path = "../goblin-interpreter" }
goblin-ast = { path = "../goblin-ast" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
goblin-devserver = { path = "../goblin-devserver" }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_System_Console"] }
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[bin]]
name = "goblin"               # <— this is the installed executable name
path = "src/main.rs"
