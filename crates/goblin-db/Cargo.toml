[package]
name = "goblin-db"
version = "0.1.0"
edition = "2021"

[dependencies]
goblin-diagnostics = { path = "../goblin-diagnostics" }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "tls-native-tls", "json", "chrono", "rust_decimal"] }
serde_json = "1"
chrono = "0.4"
rust_decimal = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
