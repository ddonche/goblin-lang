[package]
name = "goblin-vm"
version = "0.2.0"
edition = "2021"

[dependencies]
slab = "0.4"
goblin-ast = { path = "../goblin-ast" }
goblin-diagnostics = { path = "../goblin-diagnostics" }
goblin-parser = { path = "../goblin-parser" }
goblin-lexer = { path = "../goblin-lexer" }
rust_decimal = "1"
indexmap = "2"
regex = "1"
serde_json = "1"
goblin-yall = { path = "../goblin-yall" }
goblin-des = { path = "../goblin-des" }
toml = "1.1.2"
uuid = { version = "1", features = ["v4", "v7", "js"] }
walkdir = "2"
comrak = "0.21"
chrono     = { version = "0.4", features = ["clock"] }
chrono-tz  = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "yaml-load"] }
goblin-http = { path = "../goblin-http" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html"] }
getrandom = { version = "0.2", features = ["js"] }

[[bench]]
name = "vm_bench"
harness = false